<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALS Workflow Observability</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
    --accent: #2f5d8a; --warn-bg: #fff4d6; --warn: #7a5a00; --bad: #a33a2a; --ok: #2f6b3a; --chip: #eef2f6;
    --legend-agent: #1e5a8a; --legend-parallel: #2d7ba8; --legend-check: #d97706; --legend-exit: #b91c1c; --legend-end: #4b5563;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #e9e9e4; --muted: #9a9a93; --line: #34342f;
      --accent: #8ab4dc; --warn-bg: #3a3017; --warn: #f0d58a; --bad: #f09a8a; --ok: #9bd3a6; --chip: #2a3038;
      --legend-agent: #60a5fa; --legend-parallel: #93c5fd; --legend-check: #fbbf24; --legend-exit: #f87171; --legend-end: #d1d5db;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 16px 20px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 16px; margin: 0 0 12px; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    font: inherit; padding: 8px 12px; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; overflow-x: auto; }
  .panel.focused { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  code, pre { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 8px 0 0; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .help { cursor: help; border-bottom: 1px dotted currentColor; }
  #help-tip { position: fixed; z-index: 2000; max-width: 560px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); font: 12px/1.5 ui-monospace, monospace;
    white-space: pre-wrap; pointer-events: none; }
  .chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 0 8px; margin: 0 4px 4px 0; font-size: 12px; }
  .warning-box { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 12px; margin: 4px 0; }
  .bad { color: var(--bad); font-weight: 600; }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); font-weight: 600; }
  details summary { cursor: pointer; color: var(--accent); margin-top: 8px; }
  ul.runs { list-style: none; padding: 0; margin: 0; }
  ul.runs button { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 2px 0; }
  .error { color: var(--bad); white-space: pre-wrap; }
  .token-bar { display: flex; gap: 8px; margin: 12px 0; }
  .token-bar-item { flex: 1; }
  .token-bar-label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
  .token-bar-fill { position: relative; height: 24px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .token-bar-progress { display: flex; height: 100%; position: relative; }
  .token-bar-segment { display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 600; }
  .token-segment-fresh { background: #4a9eff; }
  .token-segment-cache-write { background: #a68bfa; }
  .token-segment-cache-read { background: #8bfadb; }
  .token-segment-output { background: #fbbf24; }
  .token-bar-state-ok .token-bar-progress { }
  .token-bar-state-warn .token-bar-progress { background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); background-size: 8px 8px; }
  .token-bar-state-bad .token-bar-progress { }
  .token-bar-status { position: absolute; right: 8px; top: 4px; font-size: 10px; font-weight: 700; color: var(--text); }
  .token-run-selector { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .token-run-selector select { flex: 1; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); }
  .token-mode-toggle { display: flex; gap: 4px; }
  .token-mode-toggle button { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; color: var(--text); }
  .token-mode-toggle button[aria-selected="true"] { background: var(--accent); color: white; }
  .token-pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .graph-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .graph-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .graph-legend-box { width: 20px; height: 20px; border: 1px solid #999; border-radius: 2px; }
  .node-details { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; max-width: 400px; max-height: 300px; overflow-y: auto; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
  .panel table { min-width: 100%; border-collapse: collapse; }
  .panel td { word-break: break-word; overflow-wrap: break-word; max-width: 180px; font-size: 13px; }
  .panel th { word-break: break-word; overflow-wrap: break-word; max-width: 180px; }

  /* Runs card styles */
  .runs-grid { display: grid; gap: 12px; }
  .runs-grid .panel {
    transition: box-shadow 0.2s ease;
  }
  .runs-grid .panel:hover {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }
  @media (prefers-color-scheme: dark) {
    .runs-grid .panel:hover {
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05);
    }
  }

  .chip.ok { background: rgba(47, 107, 58, 0.2); color: var(--ok); }
  .chip.bad { background: rgba(163, 58, 42, 0.2); color: var(--bad); }
  .chip.warn { background: rgba(122, 90, 0, 0.2); color: var(--warn); }
  .chip.idle { background: var(--chip); color: var(--muted); }
  /* Header badge marking the run the token bar is following. Built on --ok, which both themes define. */
  .live-badge { display: inline-block; background: var(--ok); color: var(--panel); border-radius: 4px;
    padding: 0 6px; margin-left: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; vertical-align: 1px; }

  /* live progress bar */
  .progress-bar { width: 100%; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 4px; }

  /* Status badge animations */
  .status-running { color: var(--ok); font-weight: 600; }
  .status-stalled { color: var(--warn); font-weight: 600; }
  .status-error { color: var(--bad); font-weight: 600; }
  .pulse-running { animation: pulse-green 1.5s infinite; }
  @keyframes pulse-green { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* Running cards grid */
  .running-grid { display: grid; gap: 12px; }
  .running-card { display: flex; flex-direction: column; gap: 8px; transition: box-shadow 0.2s ease; }
  .running-card:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
  @media (prefers-color-scheme: dark) {
    .running-card:hover { box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05); }
  }

  .running-empty { text-align: center; padding: 40px 20px; }
  .running-loading { text-align: center; padding: 20px; }

  /* Run context bar: the run is chosen once, for every view. */
  .runbar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .5rem 0 1rem; }
  .runbar select { min-width: 22rem; padding: .35rem .5rem; font: inherit; }
  .causal-dialog { width: min(760px, 95vw); background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
  .causal-dialog::backdrop { background: rgba(0,0,0,.45); }
  .runbar .live { padding: .35rem .7rem; font: inherit; cursor: pointer; color: #e2d9d9; }
  .runbar .live[disabled] { opacity: .45; cursor: default; }
  .runbar .live.active { border-color: #16a34a; color: #16a34a; font-weight: 600; }
  .timeline { display: flex; gap: .4rem; flex-wrap: wrap; margin: 0 0 1rem; }
  .panel a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .panel a:hover { text-decoration-thickness: 2px; }
  /* Same look as .token-mode-toggle buttons: neutral chip, so it does not read as part of the diagram. */
  .jump-btn { background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; color: var(--text); font: inherit; }
  .jump-btn:hover { border-color: var(--accent); }
  .bubble { max-width: 85%; margin: 0 0 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); }
  .bubble-right { margin-left: auto; background: var(--panel); border-color: var(--accent); }
  .bubble-head time { color: var(--muted); font-size: .8rem; }
  .bubble-head .verdict { margin-left: .5rem; font-weight: 600; }
  .verdict-rejected { background: var(--bad); color: var(--panel); }
  .verdict-revise { background: var(--warn-bg); color: var(--warn); }
  .verdict-accepted, .verdict-surviving { background: var(--ok); color: var(--panel); }
  .note { text-align: center; font-size: .85rem; color: var(--muted); margin: 0 0 10px; }
  .note summary { cursor: pointer; }
  .note pre { text-align: left; white-space: pre-wrap; max-height: 16rem; overflow: auto; background: var(--chip); padding: 8px; border-radius: 4px; }
  .note > span, .note summary { display: inline-block; padding: 2px 12px; border: 1px dashed var(--line); border-radius: 999px; }
  .note-warn > span, .note-warn summary { border-color: var(--warn); color: var(--warn); }
  .note-bad > span, .note-bad summary { border-color: var(--bad); color: var(--bad); }
  .note-ok > span, .note-ok summary { border-color: var(--ok); color: var(--ok); }
  .bubble details { margin: 4px 0; }
  .bubble pre { white-space: pre-wrap; max-height: 24rem; overflow: auto; margin: 4px 0 0; }
  .timeline-label { flex-basis: 100%; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .timeline .stage { padding: .2rem .6rem; border: 1px solid currentColor; border-radius: 999px; font-size: .85rem; }
  .stage-passed { color: #16a34a; } .stage-failed { color: #dc2626; }
  .stage-running { color: #d97706; } .stage-not_started { opacity: .5; }
  .subnav { display: flex; gap: .3rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .tools { margin: 0 0 10px 1.5rem; font-size: .85rem; }
  .tools ol { margin: 4px 0; padding-left: 1.5rem; }
  .tools li { margin-bottom: 4px; }
  .tool-io { font: 11px/1.4 ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
  .flow-node { flex: 0 1 230px; border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 6px; padding: 8px 10px; background: var(--bg); font-size: 13px; }
  .flow-node .kv { font-size: 12px; }
  .flow-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .flow-completed { border-left-color: var(--ok); } .flow-failed { border-left-color: var(--bad); }
  .flow-running, .flow-not_marked_completed { border-left-color: var(--warn); } .flow-not_reached { opacity: .6; }
  .flow-edge { align-self: center; color: var(--muted); font-size: 20px; }
  .flow-attempts { padding-left: 1rem; margin: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>ALS Workflow Observability</h1>
  <nav role="tablist">
    <button role="tab" id="tab-run" aria-selected="true" data-tab="run">Run</button>
  </nav>
</header>
<main>
  <section id="run" role="tabpanel">
    <div class="runbar">
      <label for="run-select">Run</label>
      <select id="run-select"></select>
      <button type="button" id="run-live" class="live" disabled>No run in progress</button>
    </div>
    <div id="run-timeline" class="timeline"></div>
    <nav class="subnav" id="run-subnav" role="tablist"></nav>
    <div id="run-view"></div>
  </section>
</main>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
