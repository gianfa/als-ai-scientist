# Smoke configuration: smallest, cheapest run of the implemented phases, to test the launcher end to end
# and measure the per-phase launch overhead. Derived from pipeline.yaml.
version: '1'
objective: Identify a therapeutic intervention capable of selectively modifying the C9orf72-associated immune mechanism
  in ALS while preserving systemic immune competence and protecting motor neurons.
launcher:
  # Sonnet, not Haiku: the launcher session has one instruction (call the Workflow tool once) and a Haiku session
  # has been seen to ignore it, failing the phase with `not_launched`. Its own token use is small
  # (a few hundred output tokens per phase), so the model matters more than the price here.
  model: claude-sonnet-5
  timeout_s: 900
  # No per-session budget: the launcher hands each session what is left of run_max_cost_usd.
# Ten phases, with the launcher sessions and the PI on Sonnet, are predicted
# at 3.5-5.5 USD, and a run stopped by the cap at phase 9 would waste everything already spent.
run_max_cost_usd: 8
literature_store: literature/store
fetch_max_new: 5
phases:
  data:
    sources:
    - id: michaelis-table1-epitopes
      acquire:
        see: docs/data-acquisition.md section 1
        steps:
        - run: scripts/data/paper-download.py --format pdf
        - by_hand: open the URL it prints, save the PDF as literature/inbox/michaelis-2025.pdf, then extract it with
            Paper2Agent using the command in docs/data-acquisition.md section 1.1 — the --output path and
            the default table asset names are what this source's path depends on
        - run: scripts/setup/check-paper2agent.sh
      path: dist/michaelis-2025-agent/skill/michaelis-2025-paper/assets/table/table-p0006-001.csv
      kind: table
      license_note: Extraction from Michaelis et al. (2025), CC BY-NC-ND 4.0; local paper2agent output, not redistributed.
    - id: michaelis-table2-hla
      acquire:
        see: docs/data-acquisition.md section 1
        steps:
        - run: scripts/data/paper-download.py --format pdf
        - by_hand: open the URL it prints, save the PDF as literature/inbox/michaelis-2025.pdf, then extract it with
            Paper2Agent using the command in docs/data-acquisition.md section 1.1 — the --output path and
            the default table asset names are what this source's path depends on
        - run: scripts/setup/check-paper2agent.sh
      path: dist/michaelis-2025-agent/skill/michaelis-2025-paper/assets/table/table-p0006-007.csv
      kind: table
      license_note: Extraction from Michaelis et al. (2025), CC BY-NC-ND 4.0; local paper2agent output, not redistributed.
    - id: iedb-netmhciipan-cache
      acquire:
        see: docs/data-acquisition.md section 5
        steps:
        - by_hand: read section 5 first; the DTU academic licence must apply to you. Needs the two tables above
        - run: scripts/data/iedb-cache-acquire.py
      path: data/external/iedb-cache/netmhciipan.jsonl
      kind: table
      license_note: IEDB/NetMHCIIpan predictions acquired once under the DTU academic licence (LICENSES.md); third-party
        output, git-ignored, not redistributed. The licence forbids publishing benchmark results of the predictor.
    - id: als-gwas-gcst90027164
      acquire:
        see: docs/data-acquisition.md section 4
        steps:
        - run: scripts/data/gwas-data-download.sh
      path: data/external/gwas-als/GCST90027164_buildGRCh37.tsv.gz
      kind: sumstats
      license_note: 'GWAS Catalog summary statistics, GCST90027164 (van Rheenen et al. 2021),
        European-ancestries meta-analysis, GRCh37, as submitted: the study metadata declares
        is_harmonised false, and the catalogue harmonised/ deposit is a different file. EMBL-EBI Terms of
        Use; cite the study.'
    # Read by the registered `ics_cytokine_skew_v1` analysis, which uses the FlowJo workspaces of the four ICS
    # records and the deposited FCS file names; no analysis reads FCS events.
    - id: michaelis-zenodo-cytometry
      acquire:
        see: docs/data-acquisition.md section 2
        steps:
        - run: scripts/data/michaelis-data-download.sh
      path: data/external/michaelis-2025-zenodo
      kind: raw
      license_note: Michaelis et al. (2025) Zenodo deposit, raw flow-cytometry files; not redistributed.
      required: false
    # The figure source data of the article, read by `ics_cytokine_skew_v1` to check its recomputed values
    # against the published ones (sheet "ED Fig. 4").
    - id: michaelis-source-data
      acquire:
        see: docs/data-acquisition.md section 3
        steps:
        - by_hand: run the curl block of docs/data-acquisition.md section 3
      path: data/external/michaelis-2025-nature-supp/41586_2025_9588_MOESM3_ESM.xlsx
      kind: table
      license_note: Source data of Michaelis et al. (2025), CC BY-NC-ND 4.0 article; local only, not redistributed.
      required: false
  compute:
    analyses:
    - a1_immunodominance
    - a2_epitope_clustering
    - a3_gwas_loci
    - a4_hla_binding
    seed: 20260928
  literature:
    model: claude-haiku-4-5-20251001
    max_claims: 5
    questions:
    - Which C9orf72-specific T-cell responses are observed in ALS, in which T-cell subsets, and with which cytokines?
    - Which C9orf72 epitopes and HLA class II restrictions are reported for ALS-associated autoreactivity?
  generate:
    model: claude-haiku-4-5-20251001
    context_limit: 20
    perspectives:
    - immunology (loss of peripheral tolerance, T-cell polarisation)
    - neurodegeneration (motor-neuron injury and the role of C9orf72 loss/gain of function)
  review:
    model: claude-haiku-4-5-20251001
    reviewers: 2
    hops: 2
  verify:
    model: claude-haiku-4-5-20251001
    batch_size: 10
  design:
    model: claude-haiku-4-5-20251001
    hops: 2
  arbitrate:
    model: claude-haiku-4-5-20251001
    hops: 2
  intervene:
    model: claude-haiku-4-5-20251001
    hops: 2
  synthesize:
    # The PI runs on Sonnet: a Haiku PI has failed on invalid structured output (Haiku
    # flakiness on the large nested proposal schema), and the proposal is the one artifact read by a human.
    model: claude-sonnet-5
    hops: 1
